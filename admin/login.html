<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Admin — Lucas Franchi</title>
  <link rel="stylesheet" href="../css/estilos.css?v=2" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box {
      background: var(--azul-med);
      border: 1px solid var(--borde);
      border-radius: var(--radio-lg);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-box img { height: 64px; margin: 0 auto 24px; }
    .login-box h2 { color: var(--dorado); font-size: 22px; margin-bottom: 6px; }
    .login-box p { color: var(--gris); font-size: 13px; margin-bottom: 28px; }
    .campo { text-align: left; margin-bottom: 16px; }
    .campo label { color: var(--gris); font-size: 12px; display: block; margin-bottom: 6px; }
    .campo input {
      width: 100%;
      background: var(--azul);
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      color: var(--blanco);
      font-size: 14px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .2s;
    }
    .campo input:focus { border-color: var(--dorado); }
    .btn-login {
      width: 100%;
      background: var(--dorado);
      color: var(--azul);
      border: none;
      border-radius: var(--radio);
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: background .2s;
    }
    .btn-login:hover { background: var(--dorado-cl); }
    .error { color: #e57373; font-size: 13px; margin-top: 12px; display: none; }
  </style>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T5YCECGL58"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-T5YCECGL58');
</script>
</head>
<body>
  <div class="login-box">
    <img src="../img/logo.jpeg" alt="Lucas Franchi" onerror="this.style.display='none'" />
    <h2>Panel de administración</h2>
    <p>Acceso exclusivo — Lucas Franchi Inmobiliaria</p>

    <div class="campo">
      <label>Email</label>
      <input type="email" id="email" placeholder="tu@email.com" autocomplete="username" onkeydown="if(event.key==='Enter')login()" />
    </div>
    <div class="campo">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="••••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()" />
    </div>
    <button class="btn-login" id="btn-login" onclick="login()">Ingresar</button>
    <p class="error" id="error-msg">Email o contraseña incorrectos.</p>
  </div>

  <script src="../js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
  <script>
    const DB = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

    // Si ya hay una sesión real activa, ir directo al panel
    DB.auth.getSession().then(({ data }) => {
      if (data && data.session) window.location.href = 'panel.html';
    });

    async function login() {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('password').value;
      const errEl = document.getElementById('error-msg');
      const btn   = document.getElementById('btn-login');
      errEl.style.display = 'none';
      if (!email || !pass) {
        errEl.textContent = 'Completá el email y la contraseña.';
        errEl.style.display = 'block';
        return;
      }
      btn.disabled = true;
      const { error } = await DB.auth.signInWithPassword({ email, password: pass });
      btn.disabled = false;
      if (error) {
        // Mensaje genérico a propósito: no revela si el email existe
        errEl.textContent = 'Email o contraseña incorrectos.';
        errEl.style.display = 'block';
        document.getElementById('password').value = '';
        return;
      }
      window.location.href = 'panel.html';
    }
  </script>
</body>
</html>
